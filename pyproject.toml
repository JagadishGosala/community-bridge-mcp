[project]
name = "community-bridge-mcp"
version = "0.1.0"
description = "MCP server for nonprofit emergency-assistance funding requests (Phase 1)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.14.3",
]

[project.scripts]
cb-server = "cb.server:main"
cb-reset = "cb.reset:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cb"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
